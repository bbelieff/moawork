name: BBE-9 feature flag contract

on:
  pull_request:
    paths:
      - "app/src/lib/feature-flags/**"
      - "scripts/release/**"
      - "supabase/migrations/039_*"
      - ".github/workflows/bbe-9-feature-flags.yml"

jobs:
  feature-flag-contract:
    # ci.yml 과 같은 이유로 셀프호스티드다 — 근거는 그쪽 주석에 적었다.
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/release/check-feature-flags.mjs
      - run: npm test --workspace app -- --run src/lib/feature-flags
