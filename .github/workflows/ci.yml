name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: check (lint + typecheck + test)
    # #715: standard Windows hosted VM separates CI from local full-gate leases.
    # Uses the account's included private-repository Actions minutes.
    # Budget enforcement is a GitHub setting, not enforced by this workflow.
    # Keep standard runners only; no paid larger runner or VPS build fallback.
    runs-on: windows-2025
    # Full app/worker suites plus browser contracts can exceed 30 minutes on
    # Windows runners; keep every gate and its own timeout intact.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Fresh hosted VMs install from the lockfile; no Actions cache storage added.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare WSL containment test environment
        timeout-minutes: 5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Download-Verified($url, $target, $sha256) {
            curl.exe --fail --location --retry 2 --max-time 120 --output $target $url
            if ($LASTEXITCODE -ne 0) { throw "Download failed: $url" }
            if ((Get-FileHash -LiteralPath $target -Algorithm SHA256).Hash.ToLowerInvariant() -ne $sha256) {
              throw 'Test runtime SHA256 mismatch'
            }
          }
          # Canonical Ubuntu WSL rootfs; pin bytes so upstream changes fail closed.
          $rootfs = Join-Path $env:RUNNER_TEMP 'gate-wsl-rootfs.tar.gz'
          Download-Verified 'https://cloud-images.ubuntu.com/wsl/jammy/current/ubuntu-jammy-wsl-amd64-ubuntu22.04lts.rootfs.tar.gz' $rootfs '1483cc5c1dce13064f774834cbffdff226559fd522a67a381a8ea77d63fb4109'
          $nodeVersion = (node --version).Trim()
          if ($nodeVersion -notmatch '^v22\.\d+\.\d+$') { throw 'Expected Node 22' }
          $nodeFile = "node-$nodeVersion-linux-x64.tar.xz"
          $nodeArchive = Join-Path $env:RUNNER_TEMP $nodeFile
          $sums = (Invoke-WebRequest "https://nodejs.org/dist/$nodeVersion/SHASUMS256.txt").Content
          $checksumLines = @($sums -split "`n" | Where-Object { $_ -match ('^[a-f0-9]{64}\s+' + [regex]::Escape($nodeFile) + '\s*$') })
          if ($checksumLines.Count -ne 1) { throw 'Node checksum is missing or ambiguous' }
          Download-Verified "https://nodejs.org/dist/$nodeVersion/$nodeFile" $nodeArchive ($checksumLines[0].Substring(0, 64))
          # WSL1 avoids nested virtualization; only this disposable VM is changed.
          wsl.exe --import MoaWorkGate (Join-Path $env:RUNNER_TEMP 'gate-wsl') $rootfs --version 1
          if ($LASTEXITCODE -ne 0) { throw 'WSL import failed' }
          wsl.exe --set-default MoaWorkGate
          if ($LASTEXITCODE -ne 0) { throw 'WSL default selection failed' }
          $nodeArchivePosix = $nodeArchive.Replace('\', '/')
          $linuxArchive = (@(wsl.exe -d MoaWorkGate --exec wslpath -u $nodeArchivePosix) -join "`n").Trim()
          if ($LASTEXITCODE -ne 0 -or $linuxArchive -notmatch '^/mnt/[a-z]/') { throw 'WSL path resolution failed' }
          wsl.exe -d MoaWorkGate --exec tar -xJf $linuxArchive -C /usr/local --strip-components=1
          if ($LASTEXITCODE -ne 0) { throw 'Native Node extraction failed' }
          wsl.exe -d MoaWorkGate --exec ln -s /usr/local/bin/node /usr/bin/node
          if ($LASTEXITCODE -ne 0) { throw 'Native Node path setup failed' }
          wsl.exe --exec bash -lc 'set -eu; uname -r; command -v pgrep; /usr/bin/node --version'
          if ($LASTEXITCODE -ne 0) { throw 'WSL test runtime probe failed' }

      - name: Install dependencies
        run: npm ci

      - name: Run quality gate
        # BBE-614 — check.sh 자체의 machine-wide FIFO lease 가 로컬 worktree/clone과
        # 같은 물리 기기의 다른 runner까지 직렬화한다. GitHub concurrency로 대기 실행을
        # 교체 취소하지 않으며, focused workflow는 이 lease에 들어오지 않는다.
        run: .\scripts\run-check-windows.ps1
