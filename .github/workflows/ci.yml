name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 같은 브랜치에 새 커밋이 오면 이전 실행을 취소한다 — 이미 낡은 결과에 분을 쓰지 않는다.
# Windows 러너는 분이 2배로 청구되므로 버려질 실행 하나가 특히 비싸다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (lint + typecheck + test)
    # Windows 유지는 선택이 아니라 제약이다 — scripts/gate-lease.mjs 가 non-win32 를
    # GATE_POSIX_CONTAINMENT_UNAVAILABLE 로 명시적으로 거부한다(cgroup v2/pidfd/subreaper
    # 격리 미구현). Linux 러너로 옮기려면 그 격리를 먼저 구현해야 하고, 그건 별도 작업이다.
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # 의존성 캐시 — 예전엔 캐시가 없어 npm ci 가 매번 레지스트리에서 전부 받았다.
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run quality gate
        # BBE-614 — check.sh 자체의 machine-wide FIFO lease 가 로컬 worktree/clone과
        # 같은 물리 기기의 다른 runner까지 직렬화한다. GitHub concurrency로 대기 실행을
        # 교체 취소하지 않으며, focused workflow는 이 lease에 들어오지 않는다.
        run: .\scripts\run-check-windows.ps1
