name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (lint + typecheck + test)
    # ★ 2026-08-25 — GitHub 호스팅 러너에서 «셀프호스티드» 로 옮긴다.
    #
    #   왜 — 이 저장소는 비공개라 Actions 분이 무료 한도에서 깎인다.
    #   2026-08 실측: 911회 실행 · 청구 3,983분(무료 2,000분의 약 2배) → 8/24 15:06 UTC 부터
    #   저장소 전체 CI 가 과금으로 멈췄다. 워커 넷이 붙는 구조에서는 앞으로도 계속 넘는다.
    #
    #   왜 «공개 전환» 이 아니라 이것인가 — 공개하면 분은 무료가 되지만
    #   히스토리(1,074커밋)에 있는 첫 고객 자료가 영구 공개된다. 실측: 「서울경영」 582건 ·
    #   온보딩 녹취록 · 먼데이 실데이터 · 더미 아닌 휴대폰 번호 2건. 지워도 히스토리엔 남는다.
    #   셀프호스티드는 비공개를 유지하면서 분 과금이 0 이다.
    #
    #   대가 — 데탑이 꺼져 있으면 CI 가 «큐에 쌓인 채» 안 돈다. 그래서 timeout 을 둔다.
    #   러너: C:\actions-runner (moawork-desktop) · 로그온 시 시작프로그램으로 자동 기동.
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run quality gate
        run: bash scripts/check.sh
