      AP-0003 hazard(Object.assign 통째 교체) 는 **이미 반영돼 있다** — appendFileRef/
      removeFileRef 가 `{...(custom ?? {}), files: [...]}` 로 병합하며, 첨부·삭제 양쪽 경로
      모두 해당. 회귀 테스트로 고정: 'T05 계약상황 + T09 실행액/수수료율/수수료입금일이
      첨부·삭제 양쪽에서 보존된다'.
      ⚠ 잔여: read-modify-write 는 원자적이지 않아 동시 갱신 시 lost-update 가 남는다
      (로컬 단일 프로세스에서는 비노출). 제안: B안보다 포트에 `patchDealCustom(ctx,id,partial)`
      병합 접근자를 두면 custom 을 쓰는 **모든 트랙(T04·T05·T09)** 이 같은 함정을 피한다.
      MVP 차단 요소 아님 — T03 판단에 맡기고, 추가되면 즉시 전환한다.
    note_on_AP0002: >-
      AP-0002 의 moveDeal 해소안(포트에 moveDeal 추가 + DealPatch 에서 stage_id 제외)에 대해:
      T04 는 **updateDeal 을 custom 갱신에만** 쓰고 stage_id 를 건드리지 않으므로 그 변경에
      영향받지 않는다(files 서비스는 DealFilesPort 로 의존 표면을 2개 메서드로 좁혀 둠).

