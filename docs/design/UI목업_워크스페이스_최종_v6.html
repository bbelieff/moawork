<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>모아워크 · 워크스페이스 UI 최종 목업 v6 (1440px · 전 탭)</title>
<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.css');
:root{
  /* 브랜드 (design-tokens.md §1) */
  --brand:#6B5CFF; --record:#3478F6; --flow:#18A999; --people:#F26B5E;
  /* 중립 · 따뜻한 회색 (§12) */
  --s0:#FAF9F7; --s1:#F4F2EF; --s2:#FFFFFF;
  --t1:#1C1A17; --t2:#5C574F; --t3:#8E877C; --t4:#B5AEA3;
  --bd:#E7E5E0; --bd2:#D8D5CE;
  /* 강조 배경 */
  --acc-bg:#EFEDFE; --acc-ink:#4B3FD4;
  --ppl-bg:#FDEDEA; --ppl-ink:#A8412F;
  /* 모서리·그림자 (§11) */
  --r1:6px; --r2:8px; --r3:10px;
  --shpop:0 8px 24px rgba(28,25,20,.10), 0 2px 6px rgba(28,25,20,.06);
  /* 간격 (§8) */
  --sp1:4px; --sp2:8px; --sp3:12px; --sp4:16px; --sp5:20px; --sp6:24px;
  /* 밀도 (§7) */
  --row:32px; --nav:220px;
  /* 하위호환 별칭 */
  --bg:var(--s0); --panel:var(--s2); --ink:var(--t1); --ink2:var(--t2); --ink3:var(--t3);
  --line:var(--bd); --line2:var(--bd2);
  --accent:var(--brand); --accent-bg:var(--acc-bg); --accent-ink:var(--acc-ink);
  --coral:var(--people); --coral-bg:var(--ppl-bg); --radius:var(--r2);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--s0);color:var(--t1);font:400 13px/1.35 Pretendard,-apple-system,"Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}

.app{display:flex;min-height:100vh}
.side{width:var(--nav);flex:0 0 var(--nav);background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{height:48px;display:flex;align-items:center;gap:var(--sp2);padding:0 var(--sp3);border-bottom:1px solid var(--bd);width:100%;text-align:left}
.brand:hover{background:var(--s1)}
.logo{width:22px;height:22px;flex:0 0 22px}
.brand b{font-size:15px;font-weight:600;letter-spacing:-.01em}
.hom{margin-left:auto;font-size:11px;color:var(--t4);opacity:0}
.brand:hover .hom{opacity:1}
.brand b{font-size:15px;letter-spacing:-.2px}
.wsbtn{margin:10px;padding:8px 10px;border:1px solid var(--line2);border-radius:8px;display:flex;align-items:center;gap:8px;text-align:left;width:calc(100% - 20px)}
.wsbtn:hover{background:var(--s1)}
.wsbtn .ic{width:22px;height:22px;border-radius:6px;background:var(--t1);color:#fff;display:grid;place-items:center;font-size:11px;flex:0 0 22px}
.wsbtn .nm{font-size:13px;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wsbtn .ch{color:var(--ink3);font-size:11px}
.nav{padding:4px 8px;overflow:auto;flex:1}
.nav .sec{font-size:11px;color:var(--t3);padding:12px 8px 4px;letter-spacing:.3px}
.nav .sec.top{font-size:11.5px;color:var(--t2);font-weight:600;padding:15px 8px 4px;border-top:1px solid var(--bd);margin-top:8px}
.nav .sec.top.first{border-top:0;margin-top:2px;padding-top:10px}
.nav .sec.sub{display:flex;align-items:center;gap:5px;padding:9px 8px 3px 14px;color:var(--t3);font-size:10.5px}
.nav .sec.sub.fold{cursor:pointer;border-radius:7px;margin:2px 0}
.nav .sec.sub.fold:hover{background:var(--s1);color:var(--t2)}
.nav .ncar{font-size:9px;color:var(--t4);width:9px}
.nav .nnum{margin-left:auto;font-size:10px;color:var(--t4);background:var(--s1);border-radius:9px;padding:0 6px}
.nav button.it.ind{padding-left:14px}
.nav button.it{display:flex;align-items:center;gap:9px;height:34px;padding:0 8px;border-radius:7px;font-size:13.5px;width:100%;text-align:left}
.nav button.it:hover{background:var(--s1)}
.nav button.it.on{background:var(--accent-bg);color:var(--accent-ink);font-weight:600}
.nav button.it.off{color:var(--t4);cursor:not-allowed}
.nav .lb{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav .em{font-size:10.5px;color:var(--t4);border:1px solid #e8eaf1;border-radius:5px;padding:1px 5px}
.nav .cnt{font-size:11px;background:var(--s1);color:var(--t2);border-radius:var(--r1);padding:1px 6px;min-width:19px;text-align:center;font-weight:600}
.nav .cnt.hot{background:var(--coral-bg);color:var(--coral);font-weight:600}
.me{border-top:1px solid var(--line);padding:9px 12px;display:flex;align-items:center;gap:8px}
.av{width:26px;height:26px;border-radius:50%;background:var(--coral-bg);color:var(--coral);display:grid;place-items:center;font-size:11px;font-weight:600}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{height:48px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 18px;position:sticky;top:0;z-index:30}
.crumb{font-size:12.5px;color:var(--ink3)}
.search{margin-left:auto;width:260px;height:30px;border:1px solid var(--line2);border-radius:7px;display:flex;align-items:center;gap:7px;padding:0 10px;color:var(--ink3);font-size:12.5px}
.iconbtn{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;font-size:15px;position:relative}
.iconbtn:hover{background:var(--s1)}
.dot{position:absolute;top:4px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--coral);border:1.5px solid #fff}

.phead{background:#fff;border-bottom:1px solid var(--line);padding:10px 18px 0}
.hrow{display:flex;align-items:center;gap:10px;min-height:36px}
.hicon{width:30px;height:30px;border-radius:var(--r2);background:var(--s1);display:grid;place-items:center;color:var(--t2);flex:0 0 30px}
.hsub{font-size:12px;color:var(--t3)}
.hstat{font-size:12.5px;color:var(--t2);display:inline-flex;align-items:center;gap:7px;white-space:nowrap;overflow:hidden}
.hstat b{font-weight:600;color:var(--t1)}
.hdot{width:3px;height:3px;border-radius:50%;background:var(--t4);display:inline-block}
.vrow{display:flex;align-items:center;gap:8px;margin-top:10px;padding-bottom:2px;overflow-x:auto;white-space:nowrap}
.vrow::-webkit-scrollbar{height:0}
.vlab{font-size:11px;color:var(--t3);flex:0 0 auto}
.vseg{display:inline-flex;border:1px solid var(--bd);border-radius:var(--r2);overflow:hidden;flex:0 0 auto}
.vsg{height:28px;padding:0 11px;font-size:12.5px;color:var(--t2);display:inline-flex;align-items:center;gap:5px;border-right:1px solid var(--bd)}
.vsg:last-child{border-right:0}
.vsg .ic16{width:14px;height:14px}
.vsg:hover{background:var(--s1)}
.vsg.on{background:var(--t1);color:#fff}
.vdiv{width:1px;height:18px;background:var(--bd);flex:0 0 auto;margin:0 3px}
.vchip{height:28px;padding:0 11px;border:1px solid var(--bd);border-radius:999px;font-size:12.5px;color:var(--t2);display:inline-flex;align-items:center;gap:5px;flex:0 0 auto}
.vchip:hover{border-color:var(--bd2);background:var(--s1)}
.vchip.on{background:var(--acc-bg);border-color:#C9C2F8;color:var(--acc-ink);font-weight:600}
.vchip .vdyn{margin-left:0}
.vpriv{color:var(--t4)}
.vpick{height:28px;padding:0 10px;border:1px solid var(--bd);border-radius:var(--r2);font-size:12.5px;color:var(--t2);display:inline-flex;align-items:center;gap:6px;flex:0 0 auto}
.vpick:hover{border-color:var(--bd2);background:var(--s1)}
.vpick.on{background:var(--acc-bg);border-color:#C9C2F8;color:var(--acc-ink);font-weight:600}
.vpick .ic16{width:13px;height:13px;color:var(--t4)}
.vlab2{font-size:10.5px;color:var(--t4);font-weight:400}
.vpick.on .vlab2{color:var(--acc-ink);opacity:.7}
.vsgl{font-size:12.5px}
.vadd{width:28px;height:28px;border:1px dashed var(--bd2);border-radius:var(--r2);color:var(--t3);display:grid;place-items:center;flex:0 0 auto}
.vadd:hover{border-color:var(--brand);color:var(--acc-ink);background:var(--acc-bg)}
.h1{font-size:18px;font-weight:600;letter-spacing:var(--ls-tight,-.01em);display:flex;align-items:center;gap:7px;white-space:nowrap}
.sub{font-size:12.5px;color:var(--ink3);white-space:nowrap}
.tabs{display:flex;gap:2px;align-items:center;overflow:hidden}
.tab{height:28px;padding:0 12px;border-radius:7px;font-size:13px;color:var(--ink2);white-space:nowrap}
.tab:hover{background:var(--s1)}
.tab.on{background:var(--t1);color:#fff;font-weight:600}
.tab.add{color:var(--ink3);padding:0 9px}
.hspace{flex:1}
.btn{height:30px;padding:0 12px;border:1px solid var(--line2);border-radius:7px;font-size:13px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--s1)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.sm{height:26px;padding:0 10px;font-size:12.5px}
.vtabs{display:flex;gap:16px;margin-top:8px}
.vtab{padding:7px 1px;font-size:13px;color:var(--ink2);border-bottom:2px solid transparent}
.vtab.on{color:var(--ink);font-weight:600;border-bottom-color:var(--t1)}

.filter{background:#fff;border-bottom:1px solid var(--line);padding:8px 18px;display:flex;align-items:center;gap:6px;overflow-x:auto;white-space:nowrap;position:sticky;top:48px;z-index:25}
.filter::-webkit-scrollbar{height:0}
.chip{height:26px;padding:0 9px;border:1px solid var(--bd);border-radius:var(--r1);font-size:12.5px;color:var(--ink2);display:inline-flex;align-items:center;gap:5px;flex:0 0 auto}
.chip:hover{border-color:#b9c0d2;background:#fafbfe}
.chip.act{background:var(--accent-bg);border-color:#bcd0ff;color:var(--accent-ink);font-weight:600}
.chip .x{color:#8ea6e8;font-size:13px}
.chip.srch{width:180px;color:var(--ink3);justify-content:flex-start}
.fsp{flex:1}
.meta{font-size:12px;color:var(--ink3);flex:0 0 auto}

.body{padding:var(--sp3) var(--sp5) 60px;display:flex;flex-direction:column;gap:12px}
.grp{background:var(--s2);border:1px solid var(--bd);border-radius:var(--r3);overflow:hidden}
.gband{height:36px;display:flex;align-items:center;gap:9px;padding:0 12px;border-left:4px solid var(--gc,#888);cursor:pointer}
.gcar{color:var(--ink3);font-size:11px;width:14px;text-align:center}
.gname{font-weight:600;font-size:14px;color:var(--gt,#333)}
.gcnt{font-size:11px;color:var(--t2);background:var(--s2);border:1px solid var(--bd);border-radius:var(--r1);padding:1px 7px;font-weight:600}
.gsp{flex:1}
.gsum{font-size:12.5px;color:var(--ink2)}
.gsum b{color:var(--ink)}
.pchip{font-size:11.5px;border:1px solid var(--line2);background:#fff;border-radius:12px;padding:2px 9px;color:var(--ink2);display:inline-flex;align-items:center;gap:5px}
.pchip .pd{width:6px;height:6px;border-radius:50%;background:var(--coral)}
.gmore{color:var(--ink3);padding:0 4px}

.scroll{overflow-x:auto}
table{border-collapse:separate;border-spacing:0;font-size:12.5px;width:max-content;min-width:100%}
th,td{border-bottom:1px solid var(--bd);border-right:1px solid var(--bd);padding:0 var(--sp3);height:var(--row);text-align:left;white-space:nowrap;vertical-align:middle}
thead th{position:sticky;top:0;background:var(--s1);color:var(--t3);font-weight:600;font-size:11px;letter-spacing:.01em;z-index:2;height:28px;cursor:grab;user-select:none}
thead th:hover{background:var(--s1)}
thead th .fx{color:#b0a2e0;font-size:10px;margin-right:3px}
thead th::after{content:"⣿";float:right;color:var(--t4);font-size:9px;opacity:0;margin-left:6px}
thead th:hover::after{opacity:1}
th.stick,td.stick{position:sticky;left:0;z-index:3;background:#fff;border-right:1px solid var(--line2)}
thead th.stick{z-index:4;background:var(--s1)}
tbody tr:hover td{background:var(--s1)}
tbody tr:hover td.stick{background:var(--s1)}
.hnd{color:var(--t4);cursor:grab;padding-right:2px}
td.stick .nm{font-weight:600}
.pill{display:inline-block;padding:2px 7px;border-radius:var(--r1);font-size:11px;font-weight:600;line-height:1.55;white-space:nowrap}
.per{display:inline-flex;align-items:center;gap:5px}
.pav{width:19px;height:19px;border-radius:50%;background:var(--coral-bg);color:var(--coral);display:grid;place-items:center;font-size:10px;font-weight:600}
.num{text-align:right;font-variant-numeric:tabular-nums}
.calc{text-align:right;font-variant-numeric:tabular-nums;color:#6b5fb8;background:#faf9ff}
.mute{color:var(--ink3)}
.addrow td{color:var(--ink3);height:34px;font-size:12.5px}
.addrow:hover td{background:var(--s1);color:var(--accent-ink)}
.empty{padding:11px 14px;font-size:12.5px;color:var(--ink2);display:flex;align-items:center;gap:10px}
.folded{padding:10px 14px;font-size:12.5px;color:var(--ink3)}
.ins{height:22px;display:flex;align-items:center;gap:8px;font-size:11.5px;opacity:0;transition:.12s}
.ins:hover{opacity:1}
.ins .ln{flex:1;height:1px;background:var(--bd)}
.ins b{border:1px dashed var(--bd2);border-radius:12px;padding:1px 9px;font-weight:500;color:var(--ink3);background:#fff}

/* 카드형 페이지 */
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px}
.card:hover{border-color:var(--line2)}
.card h4{font-size:14px;font-weight:600;margin-bottom:3px;display:flex;align-items:center;gap:6px}
.card p{font-size:12.5px;color:var(--ink3);line-height:1.7}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:10px;padding:13px 15px}
.kpi .k{font-size:12px;color:var(--ink3)}
.kpi .v{font-size:22px;font-weight:600;margin-top:3px;letter-spacing:-.5px}
.kpi .d{font-size:11.5px;color:#3b6d11;margin-top:2px}
.plain{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.plain table{width:100%;min-width:0}
.plain th,.plain td{white-space:normal}
.pane table td{padding-top:5px;padding-bottom:5px}
.soon{background:#fff;border:1px solid var(--line);border-radius:12px;padding:52px;text-align:center}
.soon .ic{font-size:34px}
.soon h3{font-size:17px;margin:12px 0 6px}
.soon p{font-size:13px;color:var(--ink3);line-height:1.8;max-width:460px;margin:0 auto 16px}
.note{font-size:12.5px;color:var(--ink2);background:#fff;border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:11px 14px;line-height:1.8}

/* 조직관리 */
.org{display:grid;grid-template-columns:300px 1fr;gap:12px;align-items:start}
.pane{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.ptit{height:40px;display:flex;align-items:center;gap:8px;padding:0 13px;border-bottom:1px solid var(--line);font-size:13px;font-weight:600}
.ptit .r{margin-left:auto;font-size:12px;font-weight:400;color:var(--ink3)}
.tree{padding:6px}
.tnode{display:flex;align-items:center;gap:7px;height:32px;padding:0 8px;border-radius:7px;font-size:13px;cursor:pointer;width:100%;text-align:left}
.tnode:hover{background:var(--s1)}
.tnode.on{background:var(--accent-bg);color:var(--accent-ink);font-weight:600}
.tnode .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tnode .c{font-size:11px;color:var(--ink3);background:#f1f3f8;border-radius:9px;padding:1px 6px}
.tnode.on .c{background:#fff;color:var(--accent-ink)}
.tcar{color:#c2c7d4;font-size:10px;width:10px}
.tadd{color:var(--ink3);font-size:12.5px;height:30px;padding:0 8px;display:flex;align-items:center;gap:6px;width:100%;border-radius:7px}
.tadd:hover{background:var(--s1)}
.crumbline{font-size:12.5px;color:var(--ink3);padding:10px 13px 0}
.rl > span, .rlwrap{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--t2)}
td.rl{white-space:nowrap;vertical-align:middle}
.tgt{display:inline-block;padding:2px 8px;border-radius:11px;font-size:11.5px;font-weight:600;line-height:1.5;background:#eaf0ff;color:#1b47b8}
.tgt.d{background:#e1f5ee;color:#0f6e56}
.tgt.p{background:#faece7;color:#993c1d}
.bar{display:inline-block;width:52px;height:5px;border-radius:3px;background:#edeff5;vertical-align:middle;margin-right:6px;position:relative;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;background:#639922;display:block}

/* 드롭다운 메뉴 */
.wrap{position:relative;display:inline-block}
.menu{position:absolute;right:0;top:34px;background:#fff;border:1px solid var(--line2);border-radius:9px;box-shadow:0 8px 24px rgba(20,25,40,.13);padding:5px;min-width:230px;z-index:60;display:none}
.menu.open{display:block}
.menu button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:8px 10px;border-radius:7px;font-size:13px}
.menu button:hover{background:var(--s1)}
.menu .ds{font-size:11.5px;color:var(--ink3);display:block;margin-top:1px}
.menu hr{border:none;border-top:1px solid var(--line);margin:5px 2px}

/* 조직도 비주얼 */
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden}
.seg button{height:28px;padding:0 12px;font-size:12.5px;color:var(--ink2)}
.seg button.on{background:var(--t1);color:#fff;font-weight:600}
.chart{padding:22px 18px 26px;overflow-x:auto}
.lvl{display:flex;justify-content:center;gap:18px;position:relative}
.lvl+.lvl{margin-top:34px}
.oc{width:172px;background:#fff;border:1px solid var(--line2);border-radius:11px;padding:11px 12px;text-align:center;position:relative;flex:0 0 auto}
.oc.root{border-color:var(--t1);border-width:1.5px}
.oc .oav{width:34px;height:34px;border-radius:50%;margin:0 auto 6px;display:grid;place-items:center;font-size:13px;font-weight:600}
.oc .on2{font-size:13.5px;font-weight:600}
.oc .oh{font-size:11.5px;color:var(--ink3);margin-top:2px}
.oc .om{font-size:11px;color:var(--ink2);background:var(--s1);border-radius:9px;padding:1px 8px;display:inline-block;margin-top:7px}
.oc .obtn{position:absolute;top:7px;right:7px;color:#c8cdd9;font-size:12px}
.oc:hover .obtn{color:var(--ink3)}
.vln{width:1px;background:var(--line2);height:34px;margin:0 auto}
.hln{height:1px;background:var(--line2);position:absolute;top:-18px;left:86px;right:86px}
/* 조직도 트리 */
.tr2{display:flex;justify-content:center;list-style:none;margin:0;padding:0}
.tr2 ul{display:flex;justify-content:center;list-style:none;margin:0;padding:24px 0 0;position:relative}
.tr2 li{list-style:none;position:relative;padding:24px 7px 0;text-align:center}
.tr2 li::before,.tr2 li::after{content:"";position:absolute;top:0;right:50%;border-top:1px solid var(--bd2);width:50%;height:24px}
.tr2 li::after{right:auto;left:50%;border-left:1px solid var(--bd2)}
.tr2 > li{padding-top:0}
.tr2 > li::before,.tr2 > li::after{display:none}
.tr2 li:only-child::before,.tr2 li:only-child::after{display:none}
.tr2 li:first-child::before,.tr2 li:last-child::after{border:0 none}
.tr2 li:last-child::before{border-right:1px solid var(--bd2);border-radius:0 6px 0 0}
.tr2 li:first-child::after{border-radius:6px 0 0 0}
.tr2 ul::before{content:"";position:absolute;top:0;left:50%;border-left:1px solid var(--bd2);width:0;height:24px}
.dept{display:inline-block;min-width:162px;max-width:186px;background:var(--s2);border:1px solid var(--bd);border-radius:var(--r3);padding:9px 11px;text-align:left;cursor:grab;transition:border-color .1s}

 "정하늘":"하늘 매니저","미지정":"—","신규 담당자":"—"};
const AVC={"카뮈":["#FDEDEA","#A8412F"],"이대표":["#E4EFFB","#1B4F86"],"박정화 실장":["#E3F5F1","#0E6B5C"],
 "이혜진 실장":["#EDEAFB","#463C96"],"김수현":["#FAEEDA","#7A4A0A"],"이서준":["#FBEAF0","#8F2A5A"],
 "최민아":["#E6F1DF","#37600F"],"박도윤":["#EFEDE8","#514C44"],"한지우":["#FBE9E7","#8F2A22"],
 "정하늘":["#E4EFFB","#1B4F86"],"미지정":["#EFEDE8","#8E877C"],"신규 담당자":["#EFEDE8","#8E877C"]};
const AV=(n,sz)=>{const c=AVC[n]||["#EFEDE8","#5C574F"];
 return `<span class="pav" style="background:${c[0]};color:${c[1]};${sz?`width:${sz}px;height:${sz}px;font-size:${Math.round(sz*.45)}px`:""}">${String(n)[0]}</span>`};

const DEPTS=[
 {k:"root",n:"서울경영지원센터",p:null,head:"카뮈"},
 {k:"mgmt",n:"경영지원팀",p:"root",head:"정하늘"},
 {k:"sales",n:"영업본부",p:"root",head:"이대표"},
 {k:"s1",n:"영업1팀",p:"sales",head:"박정화 실장"},
 {k:"s2",n:"영업2팀",p:"sales",head:null},
 {k:"ops",n:"심사·실행팀",p:"root",head:"이혜진 실장"}];
const PPL={"카뮈":{d:"root",r:"소유자"},"정하늘":{d:"mgmt",r:"팀장"},"이대표":{d:"sales",r:"관리자"},
 "박정화 실장":{d:"s1",r:"팀장"},"김수현":{d:"s1",r:"멤버"},"이서준":{d:"s1",r:"멤버"},
 "최민아":{d:"s2",r:"멤버"},"이혜진 실장":{d:"ops",r:"팀장"},"박도윤":{d:"ops",r:"멤버"},
 "한지우":{d:"ops",r:"멤버"},"신규 담당자":{d:null,r:"—"}};
const D=k=>DEPTS.find(x=>x.k===k);
const kids=k=>DEPTS.filter(x=>x.p===k);
const membersOf=k=>Object.keys(PPL).filter(n=>PPL[n].d===k);
const descend=k=>[k,...kids(k).flatMap(c=>descend(c.k))];
const reachOf=(k,incl)=>incl?descend(k).flatMap(membersOf):membersOf(k);
function reportsTo(p){
  const me=PPL[p]; if(!me) return null;
  if(!me.d) return "카뮈";
  let d=D(me.d);
  if(d.head===p) d=d.p?D(d.p):null;
  while(d){ if(d.head && d.head!==p) return d.head; d=d.p?D(d.p):null; }
  return null;
}
function chainOf(p,steps){const out=[];let c=p;
  for(let i=0;i<(steps||3);i++){const n=reportsTo(c); if(!n||out.includes(n))break; out.push(n); c=n;}
  return out;}

function ruleCard(sent,meta,on,key){return `<div class="rule">
  <div style="flex:1"><div class="rsent">${sent}</div><div class="rmeta">${meta}</div></div>
  <div class="tg ${on?"":"off"}" ${key?`onclick="tglRule('${key}')"`:""}><i></i></div><button class="gmore">⋯</button></div>`}
let BLD={trg:"상담 상황",val:"1차 부재",act:"이동",dest:1};
const DESTN=["신규고객","1차 부재","2차 상담고객","보류","거절"];
function bldPop(kind){
  const opts=kind==="val"?["상담 전","1차 부재","2차 상담예약","2차 상담완료","보류","거절"]
    :kind==="dest"?DESTN:["상담 상황","담당자","피드백 상황","컨텍여부"];
  return `<div class="pop" onclick="event.stopPropagation()" style="min-width:190px">
    ${opts.map((o,i)=>`<button class="mi" onclick="setBld('${kind}',${kind==="dest"?i:`'${o}'`})">${o}</button>`).join("")}</div>`;
}
function setBld(k,v){BLD[k]=v;pop=null;go("auto")}
function addRule(){
  MOVE.new[BLD.val]=BLD.dest;
  RULES_ADDED.push({...BLD});
  go("auto");
  toast(`규칙을 만들었습니다 — «${BLD.val}» 로 바꾸면 «${DESTN[BLD.dest]}» 아이템으로 옮깁니다. 신규리드 관리에서 바로 시험해 보세요`);
}
const RULES_ADDED=[];
function tglRule(k){RULEON[k]=!RULEON[k];go("auto");
  toast(RULEON[k]?`규칙을 <b>켰습니다</b> — 이제 상태를 바꾸면 아이템이 이동합니다`
    :`규칙을 <b>껐습니다</b> — 신규리드 관리에서 상태를 바꿔도 이동하지 않습니다`,!RULEON[k]);}

let RID=0;
function normalize(t){
  if(!t.groups||t.records) return;
  const _k=Object.keys(T).find(x=>T[x]===t);
  /* 표시 순서 적용 — 컬럼과 값을 함께 옮기므로 데이터는 어긋나지 않는다 */
  const ord=ORDER[_k];
  if(ord){
    const want=[...ord.filter(c=>t.cols.includes(c)), ...t.cols.filter(c=>!ord.includes(c))];
    const idx=want.map(c=>t.cols.indexOf(c));
    t.cols=want;
    t.groups.forEach(g=>(g.rows||[]).forEach(r=>{
      const nv=idx.map(i=>r[i+1]); for(let j=0;j<nv.length;j++) r[j+1]=nv[j];
    }));
  }
  /* 액션 컬럼을 맨 끝으로 → 우측 고정 */
  const pc=PINR[_k];
  if(pc){ const i=t.cols.indexOf(pc);
    if(i>=0 && i!==t.cols.length-1){
      t.cols.push(t.cols.splice(i,1)[0]);
      t.groups.forEach(g=>(g.rows||[]).forEach(r=>r.push(r.splice(i+1,1)[0])));
    }}
  t.items=t.groups.map(g=>({n:g.n,c:g.c,sum:g.sum,folded:!!g.folded,fcnt:g.folded||0,empty:!!g.empty,변경:g.변경}));
  t.records=[];
  t.groups.forEach((g,i)=>(g.rows||[]).forEach(r=>t.records.push({id:++RID,g:i,r:r.slice()})));
}

/* 날짜를 넣으면 «따라 계산되는 칸» 이 같이 채워진다 — 손으로 두 번 적지 않는다 */
function setDate(tabKey,recId,ci,val){
  const t=T[tabKey], rec=t.records.find(x=>x.id===recId), col=t.cols[ci-1];
  rec.r[ci]=val||"";
  const put=(c,v)=>{const i=t.cols.indexOf(c); if(i>=0) rec.r[i+1]=v};
  let extra="";
  const o=parseD(val);
  if(tabKey==="work"&&col==="조달일"){
    if(o){ const a=addDays(o,365), b=addDays(o,180);
      put("ƒ재신청 안내일",`${a.y}-${pad2(a.m)}-${pad2(a.d)}`);
      put("ƒD+180",`${b.y}-${pad2(b.m)}-${pad2(b.d)}`);
      extra=` · <b>재신청 안내일 ${a.y}-${pad2(a.m)}-${pad2(a.d)}</b> 이 자동으로 잡혔습니다 (조달일 + 365)`;
    } else { put("ƒ재신청 안내일","—"); put("ƒD+180","—"); }
  }
  if(tabKey==="work"&&col==="예상 심사 종료"){
    if(o){ const g=dayGap(TODAY,o);
      put("ƒ심사 D-day", g>0?`D-${g}`:g===0?"오늘":"지남");
      extra=` · 심사 <b>${g>0?`D-${g}`:g===0?"오늘":"기한 지남"}</b>`;
    } else put("ƒ심사 D-day","—");
  }
  go(cur);
  if(!val){ toast(`«${col}» 을 <b>비웠습니다</b>`); return }
  toast(`«${col}» 을 <b>${val}</b> 로 정했습니다${extra}`);
}

/* ═══════════ 선택 → 발송 — 엑셀을 거치지 않는다 (BBE-127 · D63) ═══════════ */
function bulkSend(k){
  const t=T[k], rows=t.records.filter(r=>passFilter(t,r));
  const pi=(t.cols.indexOf("연락처")>=0?t.cols.indexOf("연락처"):t.cols.indexOf("전화번호"))+1;
  const withTel=rows.filter(r=>/\d/.test(String(r.r[pi]||"")));
  const noTel=rows.length-withTel.length;
  const optout=withTel.length>3?1:0;                 /* 수신 거부 이력 — 시연값 */
  const send=Math.max(withTel.length-optout,0);
  const cost=send*22;
  const on=Object.entries(F[k]||{}).map(([c,v])=>`${c} · ${v.join("/")}`);
  const one=rows[0]?rows[0].r[0]:"고객";
  document.getElementById("bulkm")?.remove();

    <h4>지금 화면에 걸린 조건 그대로 보냅니다</h4>
    <div class="bsub">${on.length?on.join("　·　"):"필터 없음 — 이 탭 전체"}　<span style="opacity:.6">· 보는 사람 ${asRole}</span></div>
    <div class="bnum">${send.toLocaleString()}<span style="font-size:15px;font-weight:400;color:var(--ink3)"> 건 발송</span></div>
    <div style="height:11px"></div>
    <div class="brow"><span>조건에 걸린 건</span><b>${rows.length}건</b></div>
    <div class="brow ${noTel?"bwarn":""}"><span>번호가 없어 빠짐</span><b>${noTel}건</b></div>
    <div class="brow ${optout?"bwarn":""}"><span>수신 거부라 빠짐</span><b>${optout}건</b></div>
    <div class="brow"><span>건당 22원 · 예상 비용</span><b>${cost.toLocaleString()}원</b></div>
    <div class="bprev"><b>미리보기</b> — 실제로 나갈 첫 문장<br>
      <span style="color:var(--ink2)">[서울경영지원센터] <b>${one}</b> 대표님, 이번 주 새로 열린 <b>특례보증</b> 안내드립니다.
      대상 여부 확인은 회신 주시면 도와드리겠습니다. 무료수신거부 080-***-****</span></div>
    <div class="bcfm">되돌릴 수 없습니다. 확인을 위해 <b>${send}</b> 를 입력하세요
      <input id="bqty" placeholder="${send}" autocomplete="off" oninput="bulkChk(${send})"></div>
    <div style="display:flex;gap:6px;margin-top:14px">
      <button class="btn sm pri" id="bgo" disabled style="opacity:.4" onclick="bulkGo(${send},${cost})">보내기</button>
      <button class="btn sm" onclick="document.getElementById('bulkm').remove()">닫기</button>
      <span style="flex:1"></span>
      <span style="font-size:11px;color:var(--ink3);align-self:center">누가 몇 건을 보냈는지 기록에 남습니다</span></div>
  </div>`;
  document.body.appendChild(m);
  setTimeout(()=>document.getElementById("bqty")?.focus(),0);
}
function bulkChk(n){

function bulkGo(n,cost){

    <span style="opacity:.65">· 엑셀로 내보내지 않았습니다 — 각 건의 히스토리에 발송이 남습니다</span>`);
}

function setCell(tabKey,recId,ci,val){
  const t=T[tabKey], rec=t.records.find(x=>x.id===recId);
  const col=t.cols[ci-1], before=rec.r[ci], fromG=rec.g;
  if(tabKey==="contact" && col==="업무이동" && val==="업무관리 이동"){
    const si=t.cols.indexOf("직인 완료")+1;
    if(RULEON.lock && rec.r[si]!=="완료"){ pop=null; showBlock(recId); return; }
    rec.r[ci]=val; pop=null;
    t.records=t.records.filter(x=>x.id!==recId);
    const g=(c)=>{const i=t.cols.indexOf(c);return i>=0?rec.r[i+1]:""};
    const mode=upsertCompany({n:rec.r[0],ceo:g("대표자명"),biz:g("사업자유형"),ind:g("업종/업태"),
      area:[g("시도"),g("시군구")].filter(x=>x&&x!=="—").join("_"),
      tel:g("연락처"),est:g("창업년도"),rev:g("매출액"),last:"계약 완료 · 실무 착수"});
    const w=T.work; normalize(w);
    const nr=new Array(w.cols.length+1).fill(""); nr[0]=rec.r[0];
    fillFrom(w,nr,COMPANIES.find(c=>c.n===rec.r[0]));
    nr[w.cols.indexOf("담당자")+1]=g("담당자")||"미배정";
    nr[w.cols.indexOf("진행상항")+1]="대기중";
    nr[w.cols.indexOf("계약금")+1]=g("계약금")||"";
    w.records.push({id:++RID,g:0,r:nr});
    notify(tabKey,rec,"업무 착수","시작",null,"승인 요청");
    go(cur); toast(`<b>이중 잠금 통과</b> — «${rec.r[0]}» 을(를) <b>계약업체 실무</b> 로 넘겼습니다
      · 업체 마스터에 <b>${mode} 저장</b>됨 (업체관리 현황에 반영)`);
    return;
  }
  /* 되돌려보내기 — 2차 상담 결과를 «요청한 담당자» 에게 되돌린다 (D60·D61) */
  if(tabKey==="new" && col==="피드백 상황" && (val==="피드백 완료"||val==="정보보완"||val==="서류보완")){
    rec.r[ci]=val; pop=null;
    const own=rec.r[t.cols.indexOf("담당자")+1]||"미배정";
    notify(tabKey,rec,col,val,null,"되돌려보내기");
    go(cur);
    toast(val==="피드백 완료"
      ? `<b>되돌려보냈습니다</b> — «${rec.r[0]}» 2차 상담 결과를 <b>${own}</b> 님 앞으로 넘겼습니다
         <span style="opacity:.65">· 요청한 사람의 화면에 «확인 대기» 로 뜹니다</span>`
      : `<b>${val} 요청</b> — «${rec.r[0]}» 을(를) <b>${own}</b> 님에게 되돌렸습니다 · 무엇이 빠졌는지 대화로 적어 주세요`);
    return;
  }
  /* 📬 컬럼 — 값이 바뀌면 솔라피로 문자가 나간다 (실측 자동화) */
  if(srcOf(tabKey,col)==="msg" && val && val!=="보내기 전" && val!=="심사 전"){
    rec.r[ci]=val; pop=null; go(cur);
    notify(tabKey,rec,col,val,null,"상태 변경");
    toast(`«${rec.r[0]}» 에게 <b>솔라피</b> 로 문자를 보냈습니다 — ${col} · «${val}»
      <span style="opacity:.65">· 건당 비용이 발생합니다</span>`);
    return;
  }
  /* 컨텍여부 = 컨텍관리 이동 → 리드컨택 관리 탭으로 넘어간다 (실측 자동화 1585198) */
  if(tabKey==="new" && col==="컨택 이동" && val==="컨택 이동"){
    rec.r[ci]=val; pop=null;
    t.records=t.records.filter(x=>x.id!==recId);
    const c=T.contact; normalize(c);
    const nr=new Array(c.cols.length+1).fill(""); nr[0]=rec.r[0];
    const cp=(from,to)=>{const i=t.cols.indexOf(from),j=c.cols.indexOf(to);
      if(i>=0&&j>=0&&rec.r[i+1]) nr[j+1]=rec.r[i+1]};
    ["광고 명","신청일","연락처","대표자명","매출액","이메일","담당자"].forEach(x=>cp(x,x));
    nr[c.cols.indexOf("계약상황")+1]="계약 전";
    nr[c.cols.indexOf("직인 완료")+1]="대기";
    nr[c.cols.indexOf("업무이동")+1]="업무 진행 전";
    c.records.push({id:++RID,g:0,r:nr});
    notify(tabKey,rec,col,val,"리드컨택 관리","상태 변경");
    go(cur);
    toast(`<b>자동화</b> — «${rec.r[0]}» 을(를) <b>리드컨택 관리</b> 로 넘겼습니다 · 필드 7개 매핑됨`);
    return;
  }
  if(col==="담당자"){
    rec.r[ci]=val; pop=null;
    const d2=((MOVE2[tabKey]||{})[col]||{})[val];
    let moved=null;
    if(RULEON.move && d2!==undefined && d2!==rec.g){ undoBuf={rec,g:rec.g,v:before,ci}; rec.g=d2; moved=t.items[d2].n }
    notify(tabKey,rec,col,val,moved,"승인 요청");
    go(cur);
    toast((val==="미배정"
      ? `담당자를 <b>비웠습니다</b> — <b>팀 전체</b>가 이 건의 변화를 알게 됩니다`
      : `담당자를 <b>${val}</b> 로 지정했습니다 — 이제부터 <b>${val} 와 직속 상사</b>만 알림을 받습니다`)
      + (moved?` · «${moved}» 아이템으로 옮겼습니다`:""));
    return;
  }
  rec.r[ci]=val;
  const dest=(RULEON.move && MOVE[tabKey]) ? MOVE[tabKey][val] : undefined;
  pop=null;
  const evt=(val==="거절"||val==="불가")?"부결 · 계약 취소":"상태 변경";
  if(dest!==null && dest!==undefined && dest!==fromG){
    undoBuf={rec,g:fromG,v:before,ci}; rec.g=dest;
    const boss=notify(tabKey,rec,col,val,T[tabKey].items[dest].n,evt);
    go(cur);
    toast(`<b>자동화</b> — «${T[tabKey].items[dest].n}» 아이템으로 옮겼습니다`+
      (boss?` · <b>${boss}</b> 님에게 보고 알림 발송`:""));
  } else {
    notify(tabKey,rec,col,val,null,evt);
    go(cur);
    if(!RULEON.move) toast(`규칙이 꺼져 있어 <b>이동하지 않았습니다</b> — 값만 «${val}» 로 바뀜`,1);
    else toast(`«${val}» 로 바꿨습니다 <span style="opacity:.6">· 이 값에는 이동 규칙이 없습니다</span>`);
  }
}

function cellPop(e,tabKey,recId,ci){

  d.style.top=Math.min(r.bottom+4,window.innerHeight-340)+"px";

    const dest=(mv[o]!==undefined?mv[o]:mv2[o]);
    const lock=(tabKey==="contact"&&col==="업무이동"&&o==="업무관리 이동");
    const outTab=(tabKey==="new"&&col==="컨택 이동"&&o==="컨택 이동");

        :dn?`<span class="ar move">→ ${dn}</span>`:""}</button>`};
  const dOf=o=>(mv[o]!==undefined?mv[o]:mv2[o]);
  const stay=opts.filter(o=>{const d=dOf(o);return d===null||d===undefined});
  const move=opts.filter(o=>{const d=dOf(o);return d!==null&&d!==undefined});
  const rows=(isPin&&move.length)
    ? (move.length?`<div class="ti2">여기서 옮겨집니다</div>`+move.map(row).join(""):"")
      +(stay.length?`<div class="ti2">이 아이템에 그대로 둡니다</div>`+stay.map(row).join(""):"")
    : opts.map(row).join("");
  d.innerHTML=`<div class="ti"><span class="tt">${col} 바꾸기</span><span class="sp"></span><span class="tn">${opts.length}개</span><button class="cpx" onclick="closePop()">✕</button></div>`
   + (opts.length>7?`<div class="cp-in">${I("search")}<input id="cpq" placeholder="찾기 · 초성 가능" autocomplete="off"></div>`:"")
   + `<div id="cplist" class="cp-list">${rows}</div>`
   + (open?`<div class="cp-add">
       <div class="cp-in" style="border:0;padding:0">
         <span style="color:var(--t3);font-size:13px">＋</span>
         <input id="newopt" placeholder="새 ${col} 입력 후 Enter" autocomplete="off">
         <button class="btn sm" onclick="addOpt('${tabKey}','${col}',${recId},${ci})">추가</button></div>
       <div class="cp-hint">여기서 추가하면 <b>이 회사의 ${col} 목록</b>에 남아 다음부터 바로 고를 수 있습니다</div>
     </div>`:"");
  document.body.appendChild(d);
  const q=document.getElementById("cpq"); if(q){q.oninput=cpFilter; setTimeout(()=>q.focus&&q.focus(),0);}
  const ni=document.getElementById("newopt");
  if(ni) ni.onkeydown=ev=>{ if(ev.key==="Enter") addOpt(tabKey,col,recId,ci) };

/* 담당자 탭 + 필터 칩 */
let ptab=0, chips={};
function passFilter(t,rec,skipScope){
  const key=curKey(t);
  if(!skipScope && !inScope(t,rec)) return false;
  if(ptab>0 && t.ptabs){
    const owner=t.ptabs[ptab], oi=t.cols.indexOf("담당자")+1;
    if(oi>0 && owner!=="미배정" && rec.r[oi]!==owner) return false;
  }
  const v=curView(key);
  if(v&&v.dyn){
    const oi=t.cols.indexOf("담당자")+1;
    if(oi>0){
      if(v.dyn==="me" && rec.r[oi]!==ME) return false;
      if(v.dyn==="team"){
        const my=PPL[ME]&&PPL[ME].d;
        const team=my?reachOf(my,true):[];
        if(!team.includes(rec.r[oi])) return false;
      }
    }
  }
  const f=F[key]||{};
  for(const col in f){
    const ci=t.cols.indexOf(col)+1;
    if(ci>0 && !f[col].includes(rec.r[ci])) return false;
  }
  return true;
}
function hitCount(t){return t.records.filter(r=>passFilter(t,r)).length}

function tglChip(i){const k=cur;chips[k]=chips[k]||{};chips[k][i]=!chips[k][i];go(cur)}

function autoSum(t,gi){
  const key=curKey(t), rows=t.records.filter(x=>x.g===gi);
  if(!rows.length) return '<span class="mute">—</span>';
  const sc=t.cols.indexOf("상담 상황")>=0?"상담 상황":(t.cols.indexOf("진행상항")>=0?"진행상항":(t.cols.indexOf("계약상황")>=0?"계약상황":null));
  let out="";
  if(sc){
    const ci=t.cols.indexOf(sc)+1, m={};
    rows.forEach(r=>m[r.r[ci]]=(m[r.r[ci]]||0)+1);
    const ent=Object.entries(m).sort((a,b)=>b[1]-a[1]);
    const col={"상담 전":["var(--s1)","#4a4f5e","#888780"],"1차 부재":["#faeeda","#854f0b","#ef9f27"],
      "2차 상담예약":["#e6f1fb","#185fa5","#378add"],"2차 상담완료":["#e1f5ee","#0f6e56","#1d9e75"],
      "보류":["#f1efe8","#5f5e5a","#b4b2a9"],"거절":["#fcebeb","#a32d2d","#e24b4a"],
      "진행중":["#e6f1fb","#185fa5","#378add"],"심사 중":["#eeedfe","#534ab7","#7f77dd"],
      "승인":["#eaf3de","#3b6d11","#639922"],"대기중":["var(--s1)","#4a4f5e","#888780"],
      "불가":["#fcebeb","#a32d2d","#e24b4a"],"계약 전":["var(--s1)","#4a4f5e","#888780"],
      "계약서 작성완료":["#eaf3de","#3b6d11","#639922"],"계약서 요청":["#eaf3de","#3b6d11","#639922"],
      "계약 보류":["#f1efe8","#5f5e5a","#b4b2a9"]};
    const tot=rows.length;
    out+='<span class="dist"><span class="dbar">'+ent.map(([k,v])=>
      `<i style="width:${Math.round(v/tot*100)}%;background:${(col[k]||["","","#b4b2a9"])[2]}"></i>`).join("")+'</span>';
    out+=ent.slice(0,2).map(([k,v])=>{const c=col[k]||["#f1efe8","#5f5e5a"];
      return `<span class="dchip" style="background:${c[0]};color:${c[1]}">${k} ${v}</span>`}).join("");
    if(ent.length>2) out+=`<span class="mute" style="font-size:11px">+${ent.length-2}</span>`;
    out+='</span>';
  }
  const mc=t.cols.indexOf("계약금")>=0?"계약금":(t.cols.indexOf("실행액")>=0?"실행액":null);
  if(mc){const ci=t.cols.indexOf(mc)+1;
    const sum=rows.reduce((a,r)=>a+(parseInt(String(r.r[ci]).replace(/[^0-9]/g,""))||0),0);
    if(sum) out+=`<span class="mute" style="font-size:11.5px">· ${mc} <b style="color:var(--t1)">${(sum/10000).toLocaleString()}만</b></span>`;
  }
  return out||`<b>${rows.length}</b>건`;
}

/* 이 아이템으로 «보내는» 선택지들 — 어느 컬럼의 어떤 값인지 */
function labelsFor(k,i){
  const out=[], mv=MOVE[k]||{}, H=HOT[k]||{};
  Object.keys(H).forEach(col=>{
    const m2=(MOVE2[k]||{})[col]||{};
    H[col].forEach(o=>{ if(mv[o]===i||m2[o]===i) out.push([col,o]) });
  });
  return out;
}
/* 아이템 이름이 바뀌면 그 아이템으로 보내는 선택지 이름도 함께 바꾼다.
   내부 연결(어느 아이템으로 가는가)은 그대로라 규칙·데이터는 안 깨진다. */
function syncLabels(k,i,newName){
  const t=T[k], pairs=labelsFor(k,i), nn=bare(newName), changed=[];
  pairs.forEach(([col,old])=>{
    if(old===nn) return;
    const L=HOT[k][col]; const at=L.indexOf(old); if(at>=0) L[at]=nn;
    if(MOVE[k]&&MOVE[k][old]!==undefined){ MOVE[k][nn]=MOVE[k][old]; delete MOVE[k][old] }
    const m2=(MOVE2[k]||{})[col];
    if(m2&&m2[old]!==undefined){ m2[nn]=m2[old]; delete m2[old] }
    const ci=t.cols.indexOf(col)+1;
    if(ci>0) t.records.forEach(r=>{ if(r.r[ci]===old) r.r[ci]=nn });
    if(S[old]&&!S[nn]) S[nn]=S[old].replace(old,nn);
    changed.push(`${col} · ${old} → ${nn}`);
  });
  return changed;
}

/* 다시 그릴 때 가로 스크롤 위치를 잃지 않는다 */
const SCROLLPOS={};
function eachScroll(fn){
  const b=document.getElementById("body");
  if(!b||!b.querySelectorAll) return;
  b.querySelectorAll("[data-sk]").forEach(fn);
}
function saveScroll(){eachScroll(el=>{const k=el.getAttribute&&el.getAttribute("data-sk");
  if(k) SCROLLPOS[k]={x:el.scrollLeft||0,y:el.scrollTop||0}})}
function restoreScroll(){eachScroll(el=>{const k=el.getAttribute&&el.getAttribute("data-sk"), p=k&&SCROLLPOS[k];
  if(p){el.scrollLeft=p.x; if(p.y) el.scrollTop=p.y}})}

let lastTab=null;
function go(k){
  cur=k; const t=T[k]; if(t.kind==="board") normalize(t); drawNav();
  document.getElementById("crumb").textContent = "서울경영지원센터 · "+t.label;
  document.getElementById("head").innerHTML = head(t);
  const fb=document.getElementById("filter");
  const fx=fb&&fb.firstChild&&fb.firstChild.scrollLeft||0;
  fb.innerHTML = filterbar(t);
  if(fx&&fb.firstChild) fb.firstChild.scrollLeft=fx;
  const u=unread();
  T.noti.cnt=u||0; T.noti.hot=u>0;
  const lb=document.getElementById("livebtn"); if(lb) lb.className="livebtn"+(LIVE?" on":"");
  document.getElementById("bellwrap").innerHTML =
    `<button class="iconbtn" onclick="tglNoti(event)">${I("bell")}${u?`<span class="dot" style="width:15px;height:15px;border-radius:8px;top:0;right:0;font-size:9px;color:#fff;display:grid;place-items:center;font-weight:600">${u}</span>`:""}</button>`
    + (notiOpen?notiPop():"");
  let html;
  if(t.kind==="board"){
    const v=curView(k);
    if(v.t==="flat"){ html = flatView(t) + (t.note?`<div class="note">${t.note}</div>`:""); }
    else if(v.t==="cal"){ html = calView(t) + (t.note?`<div class="note">${t.note}</div>`:""); }
    else html = t.items.map((g,i)=>group(t,g,i)).join("") +
      `<div class="ins" style="opacity:.6"><span class="ln"></span><b>＋ 아이템 추가</b><span class="ln"></span></div>` +
      (t.tail?`<div style="font-size:12.5px;color:var(--t3)">${t.tail}</div>`:"") +
      (t.note?`<div class="note">${t.note}</div>`:"");
  } else html = t.render();
  saveScroll();
  document.getElementById("body").innerHTML = html;
  restoreScroll();
  if(lastTab!==k){window.scrollTo(0,0);lastTab=k;ptab=0}
}
