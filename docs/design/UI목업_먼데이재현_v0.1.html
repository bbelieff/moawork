<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>모아워크 UI 목업 v0.1 — 먼데이 재현(신규고객 보드)</title>
<!--
  근거: belie 실제 화면 스크린샷(2026-07-21) + 신규고객 보드(1816794539) 라이브 API 실측.
  상태 라벨 색상은 전부 실측 hex. 아이템 데이터는 전부 가상(실고객명 금지).
  용도: T02/T04/T05 프론트 구현의 UI 정본 참고 목업(레포 제품코드 아님).
-->
<style>
  :root{
    --primary:#0073ea; --primary-hover:#0060b9;
    --text:#323338; --text-sub:#676879;
    --border:#d0d4e4; --border-light:#e6e9ef;
    --bg:#ffffff; --bg-side:#f6f7fb; --bg-hover:#f5f6f8;
    --banner:#0073ea;
    --radius:4px;
    font-size:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',Roboto,sans-serif;}
  body{color:var(--text);background:var(--bg);overflow:hidden;}
  button{cursor:pointer;border:none;background:none;color:inherit;font-size:13px;}

  /* ── 최상단 바 ── */
  .topbar{height:48px;display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid var(--border-light);}
  .logo{display:flex;align-items:center;gap:6px;font-weight:700;font-size:16px;}
  .logo .dot{width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,#0073ea,#00c875);display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:800;}
  .topsearch{flex:1;max-width:560px;margin:0 auto;background:var(--bg-hover);border:1px solid var(--border-light);border-radius:8px;height:32px;display:flex;align-items:center;gap:8px;padding:0 12px;color:var(--text-sub);}
  .topicons{display:flex;align-items:center;gap:10px;margin-left:auto;}
  .icbtn{width:32px;height:32px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:16px;position:relative;}
  .icbtn:hover{background:var(--bg-hover);}
  .badge{position:absolute;top:2px;right:2px;background:#df2f4a;color:#fff;border-radius:8px;font-size:9px;padding:0 4px;line-height:13px;}
  .avatar{width:30px;height:30px;border-radius:50%;background:#7e3b8a;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;}

  /* ── 레이아웃 ── */
  .frame{display:flex;height:calc(100vh - 48px);}
  .rail{width:56px;border-right:1px solid var(--border-light);display:flex;flex-direction:column;align-items:center;padding-top:10px;gap:4px;}
  .rail .rbtn{width:44px;height:44px;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:16px;color:var(--text-sub);gap:2px;}
  .rail .rbtn span{font-size:9px;}
  .rail .rbtn.on,.rail .rbtn:hover{background:var(--bg-hover);color:var(--text);}

  .sidebar{width:250px;background:var(--bg-side);border-right:1px solid var(--border-light);padding:12px 8px;overflow-y:auto;}
  .ws-select{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:6px 10px;font-weight:600;}
  .ws-ic{width:22px;height:22px;border-radius:6px;background:#0073ea;color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;}
  .side-sec{margin-top:14px;color:var(--text-sub);font-size:12px;padding:0 6px;}
  .snav{margin-top:6px;display:flex;flex-direction:column;gap:2px;}
  .sitem{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:var(--radius);color:var(--text);}
  .sitem:hover{background:#eceff8;}
  .sitem.on{background:#cce5ff;}
  .sitem .lock{margin-left:auto;font-size:11px;color:var(--text-sub);}
  .sub{padding-left:26px;}

  .main{flex:1;display:flex;flex-direction:column;min-width:0;}

  /* ── 84% 배너 ── */
  .limit-banner{background:var(--banner);color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center;gap:8px;padding:7px 12px;position:relative;}
  .limit-banner a{color:#fff;font-weight:600;}
  .limit-banner .x{position:absolute;right:12px;color:#fff;font-size:15px;}

  /* ── 보드 헤더 ── */
  .bheader{padding:12px 20px 0;}
  .brow1{display:flex;align-items:center;gap:10px;}
  .btitle{font-size:22px;font-weight:600;display:flex;align-items:center;gap:6px;}
  .bactions{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-sub);}
  .chip{display:flex;align-items:center;gap:5px;padding:5px 9px;border-radius:var(--radius);}
  .chip:hover{background:var(--bg-hover);}
  .chip.ai{border:1px solid var(--primary);color:var(--primary);border-radius:12px;}
  .chip .new{font-size:10px;color:var(--primary);border:1px solid var(--primary);border-radius:8px;padding:0 4px;}
  .invite{border:1px solid var(--border);border-radius:var(--radius);padding:5px 10px;font-weight:500;color:var(--text);}
  .tabs{display:flex;align-items:flex-end;gap:2px;margin-top:8px;border-bottom:1px solid var(--border-light);}
  .tab{padding:8px 12px;border-bottom:2px solid transparent;color:var(--text-sub);display:flex;gap:6px;align-items:center;}
  .tab:hover{background:var(--bg-hover);border-radius:4px 4px 0 0;}
  .tab.on{color:var(--primary);border-bottom-color:var(--primary);font-weight:600;}

  /* ── 툴바 ── */
  .toolbar{display:flex;align-items:center;gap:6px;padding:10px 20px;}
  .newitem{background:var(--primary);color:#fff;border-radius:var(--radius);display:flex;overflow:hidden;}
  .newitem .lbl{padding:6px 12px;font-weight:600;}
  .newitem .caret{padding:6px 8px;border-left:1px solid rgba(255,255,255,.3);}
  .newitem:hover{background:var(--primary-hover);}
  .tbtn{display:flex;align-items:center;gap:5px;padding:6px 9px;border-radius:var(--radius);color:var(--text);}
  .tbtn:hover{background:var(--bg-hover);}

  /* ── 보드(그룹 테이블) ── */
  .board{flex:1;overflow:auto;padding:0 20px 80px;}
  .group{margin-top:18px;}
  .ghead{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px;}
  .gtoggle{transition:transform .15s;font-size:12px;}
  .group.closed .gtoggle{transform:rotate(-90deg);}
  .gcount{color:var(--text-sub);font-weight:400;font-size:12px;}
  table{border-collapse:collapse;margin-top:6px;background:#fff;table-layout:fixed;}
  .group.closed table{display:none;}
  th,td{border:1px solid var(--border);font-size:13px;height:36px;padding:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:#fff;}
  th{font-weight:400;color:var(--text-sub);background:#fff;position:sticky;top:0;}
  td.cbar{width:6px;min-width:6px;padding:0;border-right:none;}
  th.cbar{width:6px;min-width:6px;padding:0;border-right:none;background:transparent;border-top:none;border-bottom:none;border-left:none;}
  .w-name{width:230px;} .w-date{width:100px;} .w-txt{width:120px;} .w-sm{width:90px;}
  .w-status{width:120px;padding:0;} .w-num{width:90px;text-align:right;} .w-file{width:70px;text-align:center;}
  td.name-cell{cursor:pointer;}
  td.name-cell:hover{color:var(--primary);text-decoration:underline;}
  td.status-cell{padding:0;}
  .pill{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;cursor:pointer;}
  .sumrow td{color:var(--text-sub);font-size:11px;height:30px;background:#fafbfc;}
  .addrow td{color:var(--text-sub);cursor:pointer;background:#fff;}
  .addrow td:hover{color:var(--primary);}

  /* ── 상태 드롭다운 ── */
  .dropdown{position:fixed;z-index:60;background:#fff;border:1px solid var(--border);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:8px;display:none;grid-template-columns:1fr 1fr;gap:5px;width:270px;max-height:320px;overflow:auto;}
  .dropdown .opt{height:30px;border-radius:4px;color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;}

  /* ── 아이템 상세 패널 ── */
  .panel{position:fixed;top:48px;right:-560px;width:560px;height:calc(100vh - 48px);background:#fff;border-left:1px solid var(--border);box-shadow:-6px 0 24px rgba(0,0,0,.08);transition:right .2s;z-index:50;display:flex;flex-direction:column;}
  .panel.open{right:0;}
  .phead{padding:16px 20px 0;}
  .pname{font-size:20px;font-weight:600;}
  .ptabs{display:flex;gap:2px;margin-top:12px;border-bottom:1px solid var(--border-light);}
  .pbody{flex:1;overflow:auto;padding:16px 20px;}
  .prow{display:flex;border-bottom:1px solid var(--border-light);padding:8px 0;font-size:13px;}
  .prow .k{width:130px;color:var(--text-sub);}
  .pclose{position:absolute;top:14px;right:16px;font-size:16px;color:var(--text-sub);}
  .updbox{border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--text-sub);margin-bottom:14px;}

  /* ── 토스트 ── */
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:#323338;color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;opacity:0;transition:all .25s;z-index:99;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  .helper{position:fixed;right:20px;bottom:20px;background:#fff;border:1px solid var(--border);border-radius:24px;padding:10px 16px;box-shadow:0 4px 16px rgba(0,0,0,.12);font-size:13px;display:flex;gap:6px;align-items:center;}
</style>
</head>

  {id:"g3", name:"🔍2차 상담고객", color:"#9cd326", count:1, open:true, items:[
    {name:"단비푸드", d:"6월 22", ad:"메타_정책자금A_0601", biz:"개인", co:"단비푸드", rev:"4억", tel:"010-0000-0000", files:0, own:"서단비", mgr:"박정화 실장", st:"2차 상담완료", ct:"컨텍 대기", down:""}
  ]},
  {id:"g4", name:"♻️박정화 실장", color:"#00c875", count:132, open:false, items:[]},
  {id:"g5", name:"♻️이대표", color:"#00c875", count:50, open:false, items:[]},
  {id:"g6", name:"제조업 1차 부재", color:"#7f5347", count:481, open:false, items:[]},
  {id:"g7", name:"제조업 2차 부재", color:"#563e3e", count:18, open:false, items:[]},
  {id:"g8", name:"🔇2차 부재", color:"#66ccff", count:298, open:false, items:[]},
  {id:"g9", name:"⏳️2차 후 고민", color:"#579bfc", count:41, open:false, items:[]},
  {id:"g10", name:"⚒️관리(업력 신용 등)", color:"#cab641", count:64, open:false, items:[]},
  {id:"g11", name:"📑보류", color:"#fdab3d", count:120, open:false, items:[]},
  {id:"g12", name:"⛔️해당안되는 업체", color:"#9aadbd", count:230, open:false, items:[]},
  {id:"g13", name:"🚫거절", color:"#df2f4a", count:512, open:false, items:[]},
  {id:"g14", name:"🔅지원사업만", color:"#ff5ac4", count:37, open:false, items:[]}
];

const COLS = [
  {k:"d", n:"신청일", cls:"w-date"}, {k:"ad", n:"광고 명", cls:"w-txt"},
  {k:"biz", n:"사업자 유형", cls:"w-sm"}, {k:"co", n:"회사명", cls:"w-txt"},
  {k:"rev", n:"매출액", cls:"w-sm"}, {k:"tel", n:"연락처", cls:"w-txt"},
  {k:"files", n:"파일", cls:"w-file"}, {k:"own", n:"대표자명", cls:"w-sm"},
  {k:"mgr", n:"담당자", cls:"w-status", labels:"담당자"},
  {k:"st", n:"상담 상황", cls:"w-status", labels:"상담상황"},
  {k:"ct", n:"컨텍관리", cls:"w-status", labels:"컨텍관리"},
  {k:"down", n:"계약금", cls:"w-num"}
];

/* ───────── 렌더 ───────── */
function labelColor(set, t){ const f = LABELS[set].find(l=>l.t===t); return f ? f.c : "#c4c4c4"; }

function render(){
  const board = document.getElementById("board");
  board.innerHTML = "";
  GROUPS.forEach(g=>{
    const wrap = document.createElement("div");
    wrap.className = "group" + (g.open ? "" : " closed");
    wrap.id = g.id;

    let head = `<div class="ghead" style="color:${g.color}">
      <button class="gtoggle" onclick="toggleGroup('${g.id}')">▾</button>
      <span onclick="toggleGroup('${g.id}')" style="cursor:pointer;">${g.name}</span>
      <span class="gcount">${g.count.toLocaleString()} 아이템들</span></div>`;

    let ths = `<tr><th class="cbar"></th><th class="w-name"><input type="checkbox"> Name</th>` +
      COLS.map(c=>`<th class="${c.cls}">${c.n}</th>`).join("") + `<th style="width:40px;">＋</th></tr>`;

    let rows = g.items.map((it,idx)=>{
      const cells = COLS.map(c=>{
        if(c.labels){
          return `<td class="status-cell ${c.cls}"><div class="pill" style="background:${labelColor(c.labels,it[c.k])}"
            onclick="openDropdown(event,'${g.id}',${idx},'${c.k}','${c.labels}')">${it[c.k]}</div></td>`;
        }
        if(c.k==="files"){ return `<td class="${c.cls}">${it.files>0 ? "📎"+it.files : "＋"}</td>`; }
        return `<td class="${c.cls}">${it[c.k]||""}</td>`;
      }).join("");
      return `<tr id="${g.id}-r${idx}"><td class="cbar" style="background:${g.color}"></td>
        <td class="name-cell w-name" onclick="openPanel('${g.id}',${idx})"><input type="checkbox" onclick="event.stopPropagation()"> ${it.name} <span style="color:var(--text-sub);font-size:11px;">💬</span></td>
        ${cells}<td></td></tr>`;
    }).join("");

    const fileSum = g.items.reduce((n,it)=>n+it.files,0);
    let add = `<tr class="addrow"><td class="cbar" style="background:${g.color};opacity:.5;"></td>
      <td onclick="addItem('${g.id}')">＋ 아이템 추가</td><td colspan="${COLS.length+1}"></td></tr>`;
    let sum = g.items.length ? `<tr class="sumrow"><td class="cbar"></td><td></td>` +
      COLS.map(c=> c.k==="files" ? `<td class="w-file">${fileSum} 파일</td>` : `<td></td>`).join("") + `<td></td></tr>` : "";

    wrap.innerHTML = head + `<table>${ths}${rows}${add}${sum}</table>`;
    board.appendChild(wrap);
  });
}

function toggleGroup(id){
  const g = GROUPS.find(x=>x.id===id); g.open = !g.open;
  document.getElementById(id).classList.toggle("closed", !g.open);
}

/* ───────── 상태 드롭다운(라벨 전량, 실측 hex) ───────── */
let ddCtx = null;
function openDropdown(ev, gid, idx, key, set){
  ev.stopPropagation();
  ddCtx = {gid, idx, key, set};
  const dd = document.getElementById("dropdown");
  dd.innerHTML = LABELS[set].map(l=>`<button class="opt" style="background:${l.c}" onclick="pickLabel('${l.t.replace(/'/g,"\\'")}')">${l.t}</button>`).join("");
  dd.style.display = "grid";
  const r = ev.target.getBoundingClientRect();
  dd.style.left = Math.min(r.left, window.innerWidth-290) + "px";
  dd.style.top = (r.bottom+4) + "px";
}
function pickLabel(t){
  const {gid, idx, key} = ddCtx;
  const g = GROUPS.find(x=>x.id===gid);
  g.items[idx][key] = t;
  closeDropdown();
  // 먼데이 이동 자동화 재현: 컨텍관리 = "컨텍이동" → 컨텍관리 보드로 이동
  if(key==="ct" && t==="컨텍이동"){
    const row = document.getElementById(`${gid}-r${idx}`);
    row.style.transition = "opacity .5s"; row.style.opacity = "0.15";
    setTimeout(()=>{ g.items.splice(idx,1); g.count--; render();
      toast("⚙️ 자동화: [인계]로 변경되어 🟢컨텍관리 보드로 이동했습니다"); }, 600);
  } else { render(); }
}
function closeDropdown(){ document.getElementById("dropdown").style.display="none"; }
document.addEventListener("click", e=>{ if(!e.target.closest(".dropdown")) closeDropdown(); });

/* ───────── 아이템 상세 패널 ───────── */
function openPanel(gid, idx){
  const it = GROUPS.find(x=>x.id===gid).items[idx];
  document.getElementById("pName").textContent = it.name;
  document.getElementById("pRows").innerHTML = COLS.map(c=>{
    let v = it[c.k];
    if(c.labels){ v = `<span style="background:${labelColor(c.labels,v)};color:#fff;padding:2px 10px;border-radius:4px;font-size:12px;">${v}</span>`; }
    if(c.k==="files"){ v = v>0 ? `📎 ${v}개` : "—"; }
    return `<div class="prow"><div class="k">${c.n}</div><div>${v||"—"}</div></div>`;
  }).join("");
  document.getElementById("panel").classList.add("open");
}
function closePanel(){ document.getElementById("panel").classList.remove("open"); }

/* ───────── 새 아이템 / 뷰 탭 / 토스트 ───────── */
function addItem(gid){
  const g = GROUPS.find(x=>x.id===(gid||"g1"));
  g.items.push({name:"새 업체", d:"오늘", ad:"", biz:"", co:"", rev:"", tel:"", files:0, own:"", mgr:"담당자 미정", st:"상담 전", ct:"컨텍 대기", down:""});
  g.count++; g.open = true; render();
  toast("아이템이 추가되었습니다");
}
document.getElementById("viewTabs").addEventListener("click", e=>{
  const b = e.target.closest(".tab"); if(!b) return;
  [...document.querySelectorAll("#viewTabs .tab")].forEach(t=>t.classList.remove("on"));
  b.classList.add("on");
  if(!b.textContent.includes("메인 테이블")) toast("목업 v0.1: 메인 테이블 뷰만 제공됩니다 (차트/필터 뷰는 실측 필터 로직 문서 참조)");
});
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove("show"), 2600);
}

render();
</script>
</body>
</html>
